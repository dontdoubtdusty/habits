<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Big Healthy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#fff5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1218" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Big Healthy"><meta name="apple-mobile-web-app-status-bar-style" content="default">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Theme ===== */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light;--bg:#fff5f9;--card:#fff;--fld:#fde9f1;--tx:#2b1622;--mu:#94707f;--ac:#17a65a;--bd:#f6dbe6;--neg:#e8295b;--wn:#f08c00;--pc:#ff4fa3;--pc2:#ff8ac2;--brand:#ff4fa3;--gl:10%;--tst:#2b1622;--sh:0 1px 2px rgba(60,30,60,.05),0 10px 24px -14px rgba(60,30,60,.22);--fast:.16s;--fd:'Fredoka','Nunito',system-ui,sans-serif;--bounce:cubic-bezier(.34,1.56,.64,1)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1a1218;--card:#261c23;--fld:#34262f;--tx:#fdeff5;--mu:#c3a3b3;--ac:#3ddc84;--bd:#3e2f38;--neg:#ff5c85;--wn:#ffb020;--sh:0 10px 24px -16px rgba(0,0,0,.7);--gl:20%;--tst:#3e2f38}
:root[data-theme="dark"] .card{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),var(--sh)}

/* ===== Base ===== */
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(900px 440px at 50% -140px,color-mix(in srgb,var(--pc) var(--gl),transparent),transparent 72%) no-repeat,var(--bg);color:var(--tx);font:500 15px/1.45 'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}input,select,button,b{font-variant-numeric:tabular-nums}
main{max-width:1100px;margin:0 auto;padding:12px}
/* Clips the page while it slides sideways, so it can never widen the viewport (which made the fixed nav twitch on iOS) */
.vclip{overflow:hidden;width:100%}
.view{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;align-items:start;touch-action:pan-y}
.view>.seg,.view>h2,.view>button,.view>p,.view>.tiles,.view>.wide,.view>.warn,.view>.pcb{grid-column:1/-1}
.view>h2{margin:8px 2px 0}
h2,h3{margin:0 0 10px;font-family:var(--fd);font-weight:600}h2{font-size:20px;letter-spacing:-.2px}h3{font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:center}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
.mu{color:var(--mu);font-size:13px}.neg{color:var(--neg)}.pos{color:var(--ac)}
.sec{display:block;font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--mu);margin:2px 0 6px}
.ic{display:inline-block;vertical-align:-2px}

/* ===== Cards & rows ===== */
.card,.tile{border-radius:22px;box-shadow:var(--sh)}
.card{background:var(--card);border:1px solid var(--bd);padding:16px}
.view>.card{background-image:linear-gradient(90deg,var(--pc),var(--pc2));background-size:100% 5px;background-repeat:no-repeat;background-origin:border-box;padding-top:19px}.card h2{color:var(--pc)}
.row{display:flex;gap:8px;align-items:center;margin:2px 0;min-height:38px}.row>*{min-width:0}.row>.mu{flex:none}
.ln{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}.ln span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ln b{font-weight:600;white-space:nowrap}
.tag{flex:none;font-size:10px;font-weight:800;letter-spacing:.4px;color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,transparent);border-radius:99px;padding:3px 8px;text-transform:uppercase}
.bar{height:8px;background:var(--fld);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pc),var(--pc2));transition:width .35s cubic-bezier(.2,.8,.2,1)}
.warn{border-color:var(--wn);background:color-mix(in srgb,var(--wn) 10%,var(--card))}.warn h3{color:var(--wn)}.warn .row button{padding:5px 10px;font-size:13px}

/* ===== Inputs & buttons ===== */
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],textarea,select{width:100%;padding:9px 10px;border:1px solid transparent;border-radius:12px;background:var(--fld);color:var(--tx);font:inherit;transition:border-color var(--fast),background var(--fast)}
.row input[type=text],.row input[type=number],.row input[type=date],.row input[type=time],.row select{padding:7px 8px}
input[type=number]{width:90px;flex:none;text-align:right;-moz-appearance:textfield;appearance:textfield}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:color-mix(in srgb,var(--pc) 60%,transparent);background:var(--card);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 18%,transparent)}
textarea{height:110px;resize:vertical}
/* Read mode: list rows look like plain text until you tap a field */
.ed input[type=text],.ed input[type=number]{background:transparent}
@media(hover:hover){.ed input[type=text]:hover,.ed input[type=number]:hover{background:var(--fld)}}
.ed input[type=text]:focus,.ed input[type=number]:focus{background:var(--card)}
/* Checkboxes with a little pop when ticked */
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:24px;height:24px;flex:none;margin:0;border:2px solid color-mix(in srgb,var(--mu) 45%,transparent);border-radius:8px;background:var(--card);display:inline-grid;place-content:center;cursor:pointer;transition:background var(--fast),border-color var(--fast)}
input[type=checkbox]::after{content:"";width:6px;height:11px;margin-top:-3px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
input[type=checkbox]:checked{background:linear-gradient(135deg,var(--pc),var(--pc2));border-color:transparent}input[type=checkbox]:checked::after{transform:rotate(45deg) scale(1)}
input[type=checkbox].pop{animation:pop .3s cubic-bezier(.34,1.56,.64,1)}@keyframes pop{40%{transform:scale(1.22)}}
.ed:has(>input[type=checkbox]:checked)>input[type=text]{opacity:.5;text-decoration:line-through}
button{background:linear-gradient(135deg,var(--pc),var(--pc2));color:#fff;border:0;border-radius:14px;padding:10px 16px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 6px 14px -6px color-mix(in srgb,var(--pc) 70%,transparent);transition:transform .25s var(--bounce),filter .1s,background var(--fast)}
button.g,button.x,nav button,.seg button,.gear,#toast button,.warn .row button{box-shadow:none}
button:is(:active,.prs){transform:scale(.93);filter:brightness(.95);transition-duration:.08s}
button:disabled{opacity:.4}
button.g{background:none;color:var(--mu);padding:8px 10px;font-weight:600}button.x{background:none;color:var(--neg);padding:8px 8px;font-weight:600}
button.bd{border:1px solid var(--bd);color:var(--tx)}button.x.bd{color:var(--neg)}
.seg{display:flex;gap:6px}.seg button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.seg.qm button{border-radius:999px;padding:9px 6px}.seg.qm button.on{background:linear-gradient(135deg,var(--pc),var(--pc2));border-color:transparent;color:#fff;box-shadow:0 6px 14px -6px color-mix(in srgb,var(--pc) 70%,transparent)}

/* ===== Header & bottom nav ===== */
.top{display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);color:var(--tx);border-bottom:1px solid var(--bd);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;margin-top:calc(-1 * env(safe-area-inset-top,0px));font:600 20px/1.2 var(--fd);letter-spacing:-.2px;text-align:center}
.top .tt{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 44px;white-space:nowrap}.top .logo{flex:none;animation:spin 18s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.jz{background:linear-gradient(90deg,#ff7ab8,#f0378f 55%,#ff7a59);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.gear{position:absolute;right:10px;bottom:7px;background:none;color:var(--mu);width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:12px}.gear.on{color:var(--brand);background:color-mix(in srgb,var(--brand) 13%,transparent)}
nav{position:fixed;z-index:6;left:0;right:0;bottom:0;display:flex;align-items:center;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--bd);padding:5px 6px calc(5px + env(safe-area-inset-bottom,0px))}
nav button{flex:1 1 0;min-width:0;background:none;color:var(--mu);border-radius:16px;padding:7px 0 5px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative;z-index:1;transition:color .25s}
nav button>span{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
nav button.on{color:var(--tc)}nav button:is(:active,.prs){transform:none;filter:none}
.ni{flex:none;width:24px;height:24px}
/* One small highlight pill that sits behind the active tab's icon only and glides between tabs; the buttons themselves never move */
.hl{position:absolute;left:0;top:0;z-index:0;pointer-events:none;border-radius:16px;width:var(--hw,0);height:var(--hh,0);transform:translate3d(var(--hx,0),var(--hy,0),0);background:color-mix(in srgb,var(--hc,#ff4fa3) 14%,transparent);opacity:var(--ho,0);transition:transform .34s var(--bounce),width .34s var(--bounce),opacity .2s,background .25s}
nav.drag .hl{transition:none}
/* Neighbouring tab shown beside the current one while swiping */
#peek{position:fixed;left:0;right:0;bottom:0;z-index:4;overflow:hidden;pointer-events:none;background:var(--bg);will-change:transform}
#peek>.view{max-width:1100px;margin:0 auto;padding:12px}

/* ===== Toast & popup ===== */
#toast{position:fixed;z-index:30;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px);background:var(--tst);color:#fff;border-radius:18px;padding:10px 10px 10px 16px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .18s}
#toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}#toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast button{background:none;color:#ffb020;padding:6px 10px;font-weight:800}
#dlg{position:fixed;inset:0;z-index:35;display:grid;place-items:end center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(16,8,22,.45);animation:dfade .18s ease-out}
#dlg[hidden]{display:none}
.dbox{width:100%;max-width:420px;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:dup .28s cubic-bezier(.16,1,.3,1)}
.dbox h3{margin:0 0 6px;font:600 20px/1.2 var(--fd);color:var(--tx)}.dbox p{margin:0 0 16px;font-size:14px}
.dbtns{display:flex;flex-direction:column;gap:8px}.dbtns button{width:100%;padding:12px 16px}
@media(min-width:600px){#dlg{place-items:center}}
@keyframes dfade{from{opacity:0}}@keyframes dup{from{transform:translateY(28px);opacity:0}}

/* ===== Greeting & hero ===== */
.view>.hello{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 4px -2px}
.hello b{font:600 25px/1.2 var(--fd)}.hello span{flex:none;font-size:13px;font-weight:800;color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,transparent);padding:5px 12px;border-radius:99px}
.pcb{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--pc),var(--pc2));color:#fff;border-radius:26px;padding:18px;box-shadow:0 12px 24px -12px color-mix(in srgb,var(--pc) 70%,transparent)}
.pcb:before,.pcb:after{content:"";position:absolute;border-radius:50%;background:#ffffff1c;pointer-events:none}.pcb:before{left:-50px;bottom:-80px;width:180px;height:180px}.pcb:after{right:-40px;top:-60px;width:140px;height:140px;background:#ffffff14}.pcb>*{position:relative;z-index:1}
.pcb b{display:block;font:600 34px/1.1 var(--fd)}.pcb span{font-size:13px;opacity:.9}

/* ===== Drag to reorder ===== */
.dh{flex:none;display:flex;align-items:center;justify-content:center;width:22px;height:34px;margin-left:-6px;color:var(--mu);opacity:.45;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}.dh:is(:active,.prs){cursor:grabbing}
.dragging{position:relative;z-index:20;background:var(--card);border-radius:10px;box-shadow:0 10px 24px rgba(16,24,40,.18),0 0 0 1px var(--bd);transition:box-shadow .15s}.dragging .dh{opacity:1;color:var(--pc)}
body.dragmode{user-select:none;-webkit-user-select:none;cursor:grabbing}

/* ===== App-specific styles go below this line, one commented section per feature ===== */

/* ===== Medications ===== */
.dose{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--bd)}.dose:first-of-type{border-top:0}
.dose .tm{flex:none;width:72px;font:600 15px/1.2 var(--fd);color:var(--pc)}.dose .nm{flex:1;min-width:0}.dose .nm b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dose.dn .nm b{opacity:.55;text-decoration:line-through}.tag.due{color:var(--wn);background:color-mix(in srgb,var(--wn) 14%,transparent)}
.med{padding:10px 0;border-top:1px solid var(--bd)}.med:first-of-type{border-top:0;padding-top:0}
.med>.row:first-child input[type=text]{font-weight:700}
.times{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.times span{display:flex;align-items:center;background:var(--fld);border-radius:12px;padding-right:2px}
.times input[type=time]{width:auto;background:transparent;padding:6px 4px 6px 10px}.times button.x{padding:6px}
.newmed{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.newmed input[type=text]:first-child{grid-column:1/-1}

/* ===== Routines ===== */
.rt{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}.rt:first-of-type{border-top:0;padding-top:2px}
.rt .nm{flex:1;min-width:0}.rt .nm b{display:block;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt .go{flex:none;width:44px;height:44px;padding:0;border-radius:50%;display:grid;place-items:center}
.rt button.g{padding:8px}
.edr{margin:2px 0 10px;padding:12px;border-radius:16px;background:color-mix(in srgb,var(--pc) 6%,var(--fld))}
.edr .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.edr label{display:block}.edr label .mu{display:block;margin:0 0 3px 2px;font-size:12px;font-weight:700}
.edr input[type=number]{width:100%;text-align:left}.edr .row input[type=number]{width:64px;text-align:right}
.edr .row.ed input[type=text]{background:transparent}

/* ===== Player ===== */
#play{position:fixed;inset:0;z-index:32;display:flex;flex-direction:column;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 20px calc(22px + env(safe-area-inset-bottom,0px));background:radial-gradient(700px 420px at 50% 0,color-mix(in srgb,var(--pc) 22%,transparent),transparent 70%),var(--bg);color:var(--tx);animation:dfade .2s ease-out;overflow-y:auto}
#play[hidden]{display:none}
#play .ptop{align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:8px}#play .ptop b{font:600 18px/1.2 var(--fd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#play .pbar{align-self:stretch;height:6px;border-radius:99px;background:var(--fld);overflow:hidden}#play .pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pc),var(--pc2))}
#play .rd{font-size:13px;font-weight:800;color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,transparent);padding:5px 12px;border-radius:99px;margin-top:6px}
#play .stp{font:600 30px/1.15 var(--fd);text-align:center;margin:6px 0 0;min-height:1.15em}
.ring{position:relative;width:min(72vw,280px);aspect-ratio:1;margin:8px 0}.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:var(--fld)}.ring .fg{stroke:url(#pg);transition:stroke-dashoffset .25s linear}
.ring .rnum{position:absolute;inset:0;display:grid;place-items:center;font:600 64px/1 var(--fd);letter-spacing:-1px}
#play.rest .ring .fg{stroke:color-mix(in srgb,var(--mu) 60%,transparent)}#play.rest .stp{color:var(--mu)}
#play .nx{min-height:1.4em;text-align:center}
#play .ctl{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:auto}
#play .ctl button{width:58px;height:58px;padding:0;border-radius:50%;display:grid;place-items:center}
#play .ctl button.big{width:78px;height:78px}
#play .ctl button.g{background:var(--card);border:1px solid var(--bd);color:var(--tx)}
#play .fin{display:flex;flex-direction:column;align-items:center;gap:12px;margin:auto 0;text-align:center}#play .fin b{font:600 34px/1.1 var(--fd)}
.orb{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--pc2) 55%,transparent),color-mix(in srgb,var(--pc) 30%,transparent) 70%);transition:transform .22s linear}
#play.k-breath .rnum{font-size:44px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}.confetti i{position:absolute;top:-20px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r))}}

/* ===== Water ===== */
.wtop{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}.wtop b{font:600 28px/1.1 var(--fd)}
.glasses{display:flex;flex-wrap:wrap;gap:2px;margin:10px -4px 4px}
.glasses button{background:none;box-shadow:none;color:var(--pc);padding:4px;border-radius:10px}
.glasses button svg{display:block;transition:transform .25s var(--bounce)}.glasses button.f svg{transform:scale(1.06)}
.glasses button:not(.f){color:color-mix(in srgb,var(--mu) 55%,transparent)}

@media(prefers-reduced-motion:reduce){*,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important}}

</style></head><body><header class="top"><span class="tt"><svg class="logo" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#f0378f"/><circle cx="16" cy="16" r="12.2" fill="#ffe0ef"/><circle cx="16" cy="16" r="10.6" fill="#ff7ab8"/><path d="M16 6v20M6 16h20M8.6 8.6l14.8 14.8M23.4 8.6 8.6 23.4" stroke="#ffe0ef" stroke-width="1.7" stroke-linecap="round"/><circle cx="16" cy="16" r="2.2" fill="#ffe0ef"/></svg><span><span class="jz">Big Healthy</span> Habits</span></span><button id="gear" class="gear" aria-label="Settings" data-a="gear"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></header><div class="vclip"><main id="app" class="view"></main></div><nav id="nav"></nav><div id="toast" role="status" aria-live="polite"></div><div id="play" hidden></div><div id="dlg" hidden></div>

<script>
// =====================================================================
// 1. CONSTANTS
// =====================================================================
const LS='habits-v1';                     // localStorage key (don't change once released: it holds your data)
const APP_NAME='Big Healthy Habits';
const TC={today:['#ff4fa3','#ff8ac2'],move:['#f0378f','#ff7a59'],meds:['#c4459e','#ff6fc0'],more:['#ff4fa3','#ff8ac2']}; // tab colors
// Starter routines for a new install. Each step is [name, seconds]; the whole list plays `rounds` times.
const PRESETS=[
 ['Morning stretch','stretch',1,[['Neck rolls',30],['Shoulder rolls',30],['Chest opener',30],['Side bend, left',30],['Side bend, right',30],['Forward fold',40],['Quad stretch, left',30],['Quad stretch, right',30],['Cat–cow',45],['Child’s pose',45]]],
 ['Desk break','stretch',1,[['Neck tilt, left',20],['Neck tilt, right',20],['Shoulder shrugs',20],['Wrist circles',20],['Seated twist, left',25],['Seated twist, right',25],['Look far away',20]]],
 ['Intervals 30/15','interval',8,[['Work',30],['Rest',15]]],
 ['Box breathing','breath',6,[['Breathe in',4],['Hold',4],['Breathe out',4],['Hold',4]]],
 ['4-7-8 breathing','breath',4,[['Breathe in',4],['Hold',7],['Breathe out',8]]],
];

// =====================================================================
// 2. GENERAL UTILITIES
// =====================================================================
const num=v=>+v||0;
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const uid=p=>p+Math.random().toString(36).slice(2,9);
const DAY_MS=864e5;

// =====================================================================
// 3. DATES  (all dates are local 'YYYY-MM-DD' strings)
// =====================================================================
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); // Date -> local YYYY-MM-DD
const tdy=()=>iso(new Date());
const fd=d=>d?new Date(d+'T00:00').toLocaleDateString(undefined,{month:'short',day:'2-digit'}):'';  // "Oct 09"
const longDate=d=>new Date(d+'T00:00').toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});
const stepDate=(d,n)=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()+n);return iso(x)};

// =====================================================================
// 4. STATE: seed data, schema migrations, load/save
// =====================================================================
let S,T='today';                          // data, current tab
let O={},DLG=null,FL='';                  // UI-only: open <details>, open popup, flash message
let EDR=null,PL=null;                     // UI-only: routine open in the editor, the routine playing

const presets=()=>PRESETS.map(([n,k,rounds,st])=>({id:uid('r'),n,k,rounds,steps:st.map(([n,s])=>({id:uid('s'),n,s}))}));
// A brand-new install starts with the starter routines and nothing else
function seed(){return {set:{theme:'system',welcome:1,since:Date.now(),water:8},water:{},meds:[],taken:{},routines:presets(),log:[]}}
// What counts as this app's data (used by backup import and sync)
const VALID=j=>!!j&&Array.isArray(j.meds)&&Array.isArray(j.routines);

// Schema migrations. S.v records how many have run. To change the data shape later,
// ADD a new function to the end of this list; never edit an old one.
const MIGRATIONS=[
 // v1: first version. water: {date: glasses}, meds: [{id,n,dose,times:['08:00']}], taken: {date: {'medId@08:00': time taken}},
 // routines: [{id,n,k:'stretch'|'interval'|'breath',rounds,steps:[{id,n,s}]}], log: [{d,rid,n,sec}] finished routines
 S=>{S.set=S.set||{};if(S.set.theme==null)S.set.theme='system';if(!S.set.since)S.set.since=Date.now();if(!S.set.water)S.set.water=8;
  S.water=S.water||{};S.meds=S.meds||[];S.taken=S.taken||{};S.routines=S.routines||presets();S.log=S.log||[];
  S.meds.forEach(m=>{if(!m.id)m.id=uid('m');if(!Array.isArray(m.times))m.times=['08:00']});
  S.routines.forEach(r=>{if(!r.id)r.id=uid('r');r.rounds=Math.max(1,num(r.rounds));r.steps=r.steps||[];r.steps.forEach(s=>{if(!s.id)s.id=uid('s')})})},
];
function migrate(){S.set=S.set||{};for(let v=S.v||0;v<MIGRATIONS.length;v++)MIGRATIONS[v](S);S.v=MIGRATIONS.length}
function load(){try{S=JSON.parse(localStorage.getItem(LS))}catch(e){}if(!S)S=seed();migrate()}
// Saving: write to storage a moment later (and immediately when the app is hidden or closed)
let SVT=0,SVFAIL=0;
// Saving can fail (storage full, private browsing, blocked site data). Say so once instead of failing silently.
function flush(){clearTimeout(SVT);SVT=0;try{const t=JSON.stringify(S);localStorage.setItem(LS,t);SVFAIL=0;window.CloudSync&&CloudSync.saved(t)}catch(e){if(!SVFAIL){SVFAIL=1;setTimeout(()=>toast('Couldn’t save on this device. Download a backup in Settings.'),0)}}}
const save=()=>{clearTimeout(SVT);SVT=setTimeout(flush,400)};
addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});

// Path-based edits: 'meds.3.n' etc.
const get=p=>p.split('.').reduce((o,k)=>o[k],S);
function up(p,v,t){const k=p.split('.'),l=k.pop(),o=k.reduce((o,x)=>o[x],S);o[l]=t=='n'?(parseFloat(v)||0):v;save();R()}
function add(p,o){get(p).push(o);save();R()}
function del(p,i){const [x]=get(p).splice(i,1),nm=x&&(x.n||x.t);save();R();toast('Deleted'+(nm?' “'+nm+'”':''),()=>{get(p).splice(i,0,x);save();R()},'del')}
// Undo toast
let TT=0,UNDO=null,UGRP='',UCNT=0;
// grp: consecutive toasts in the same group (e.g. several quick deletes) share one Undo that reverts all of them, newest first
function toast(msg,undo,grp){window.Feedback&&Feedback.fromToast(msg);const el=document.getElementById('toast');
 if(undo&&grp&&UNDO&&UGRP==grp){const prev=UNDO,cur=undo;undo=()=>{cur();prev()};UCNT++;msg=grp=='del'?`Deleted ${UCNT} items`:msg}else UCNT=1;
 UGRP=undo?grp||'':'';el.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-a="undo">Undo</button>':''}`;UNDO=undo||null;el.classList.add('on');clearTimeout(TT);TT=setTimeout(()=>{el.classList.remove('on');UNDO=null;UGRP=''},5000)}
// Backup reminder: nag once a week since the last backup (or snooze), counting from first use
const needBk=()=>Date.now()-Math.max(num(S.set.lastBk),num(S.set.bkSnooze),num(S.set.since))>7*DAY_MS;
const markBk=()=>{S.set.lastBk=Date.now();save();R()};
const bkNag=()=>needBk()?`<div class="card wide"><h3><span>Back up your habits?</span></h3><p class="mu" style="margin:0 0 12px">It’s only saved in this browser, and some browsers clear site data after a while.</p><div class="row"><button data-a="gear">Back up</button><button class="g bd" data-a="bkLater">Later</button></div></div>`:'';

// =====================================================================
// 5. CALCULATIONS (pure reads of S)
// =====================================================================
const rSecs=r=>sum(r.steps,s=>num(s.s))*Math.max(1,num(r.rounds));   // one full play of a routine
const water=()=>num(S.water[tdy()]);
// Today's doses, earliest first: one per medication per time of day
const doses=()=>{const tk=S.taken[tdy()]||{},now=new Date(),hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
 return S.meds.flatMap(m=>[...new Set(m.times.filter(Boolean))].map(t=>({m,t,k:m.id+'@'+t,at:tk[m.id+'@'+t],due:t<=hm}))).sort((a,b)=>a.t<b.t?-1:a.t>b.t?1:0)};
const tm=t=>!t?'':new Date('2000-01-01T'+t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});   // '08:00' -> '8:00 AM'
const clockOf=ms=>new Date(ms).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const fmt=s=>s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):String(s);   // 75 -> '1:15'
const dur=s=>s>=60?fmt(s):s+'s';
const KIND={stretch:'Stretch',interval:'Intervals',breath:'Breathing'};
const mins=s=>s<60?s+' sec':Math.round(s/60)+' min';

// =====================================================================
// 6. SHARED UI PIECES
// =====================================================================
// Inputs bound to a data path save themselves on change (data-p / data-t: n=number, s=string, b=checkbox).
const I=(p,t='text',c='')=>`<input class="${c}" type="${t}" ${t=='number'?'step="0.01" inputmode="decimal"':''} value="${esc(get(p))}" data-p="${p}" data-t="${t=='number'?'n':'s'}">`;
const C=p=>`<input type="checkbox" ${get(p)?'checked':''} data-p="${p}" data-t="b">`;
const ICX='<svg class="ic" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
const X=(p,i)=>`<button class="x" data-a="del" data-p="${p}" data-i="${i}" aria-label="Delete">${ICX}</button>`;
const DH=`<span class="dh" title="Drag to reorder"><svg viewBox="0 0 10 16" width="10" height="16" aria-hidden="true"><g fill="currentColor"><circle cx="2.5" cy="3" r="1.5"/><circle cx="7.5" cy="3" r="1.5"/><circle cx="2.5" cy="8" r="1.5"/><circle cx="7.5" cy="8" r="1.5"/><circle cx="2.5" cy="13" r="1.5"/><circle cx="7.5" cy="13" r="1.5"/></g></svg></span>`;
// A drinking glass, filled or empty
const GLASS=f=>`<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M5 3h14l-1.7 17.2a2 2 0 0 1-2 1.8H8.7a2 2 0 0 1-2-1.8z" fill="${f?'currentColor':'none'}" fill-opacity=".85" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>${f?'<path d="M7.6 8h8.8" stroke="#fff" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round"/>':''}</svg>`;
const IC=(d,w=22)=>`<svg viewBox="0 0 24 24" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I_PLAY='<path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/>',I_PAUSE='<path d="M8 5v14M16 5v14" stroke-width="3"/>',I_NEXT='<path d="M5 5l10 7-10 7z" fill="currentColor"/><path d="M19 5v14"/>',I_PREV='<path d="M19 5L9 12l10 7z" fill="currentColor"/><path d="M5 5v14"/>',I_EDIT='<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>';
const flash=()=>FL?`<div class="mu pos" style="margin-top:6px">${esc(FL)}</div>`:'';

// ---- Popup with a choice of buttons. btns: [label, button class, callback or null to just close] ----
function openDlg(t,msg,btns){DLG={b:btns.map(x=>x[2])};const el=document.getElementById('dlg');
 el.innerHTML=`<div class="dbox" role="alertdialog" aria-modal="true" aria-labelledby="dlgt" aria-describedby="dlgm"><h3 id="dlgt">${esc(t)}</h3><p class="mu" id="dlgm">${esc(msg)}</p><div class="dbtns">${btns.map((x,i)=>`<button class="${x[1]}" data-a="dlgBtn" data-i="${i}">${esc(x[0])}</button>`).join('')}</div></div>`;
 el.hidden=false;const f=el.querySelector('button');f&&f.focus();navSync()}
function closeDlg(){if(!DLG)return;DLG=null;const el=document.getElementById('dlg');el.hidden=true;el.innerHTML='';navSync()}
document.addEventListener('keydown',e=>{if(e.key=='Escape'){if(DLG)closeDlg();else if(PL)stopPlay()}});

// =====================================================================
// 7. VIEWS (one function per tab; each returns HTML for #app)
// =====================================================================
function hello(){const h=new Date().getHours(),g=h<5?'Up late':h<12?'Good morning':h<17?'Good afternoon':'Good evening';
 return `<div class="hello"><b>${g}</b><span>${new Date().toLocaleDateString(undefined,{weekday:'long'})}</span></div>`}
// First-run card: shown until dismissed (or replaced by an imported backup)
const welcome=()=>`<div class="card wide"><h3><span>Welcome to Big Healthy</span><button class="g" data-a="welcomeOff" aria-label="Dismiss">${ICX}</button></h3><p class="mu" style="margin:0">Start a stretch, interval or breathing routine on the Move tab. Add your medications on the Meds tab and tick them off here each day.</p></div>`;

// Water: one glass per tap. Tapping the last full glass empties it again.
function waterCard(){const n=water(),g=Math.max(1,num(S.set.water)),k=Math.min(24,Math.max(g,n+1));
 return `<div class="card"><h2>Water</h2><div class="wtop"><b>${n} <span class="mu" style="font:inherit;font-size:16px">of ${g} glasses</span></b>${n>=g?'<span class="tag">Goal reached</span>':''}</div>
 <div class="bar"><i style="width:${Math.min(100,Math.round(n/g*100))}%"></i></div>
 <div class="glasses">${Array.from({length:k},(_,i)=>`<button class="${i<n?'f':''}" data-a="glass" data-n="${i+1}" aria-label="${i+1} glass${i?'es':''}">${GLASS(i<n)}</button>`).join('')}</div>
 <div class="row"><button class="g bd" data-a="wSub" ${n?'':'disabled'}>Remove one</button><button data-a="wAdd" style="flex:1">Add a glass</button></div></div>`}

// Today's doses to tick off. A dose turns "Due" once its time has passed.
function medsCard(){const ds=doses();
 if(!ds.length)return `<div class="card"><h2>Medications</h2><p class="mu" style="margin:0 0 10px">Add your medications and their times, then tick each dose off here.</p><button class="g bd" data-a="tab" data-id="meds">Add a medication</button></div>`;
 return `<div class="card"><h2>Medications</h2>${ds.map(x=>`<label class="dose${x.at?' dn':''}"><span class="tm">${tm(x.t)}</span><span class="nm"><b>${esc(x.m.n)}</b><span class="mu">${esc(x.m.dose||'')}${x.at?(x.m.dose?' · ':'')+'Taken '+clockOf(x.at):''}</span></span>${!x.at&&x.due?'<span class="tag due">Due</span>':''}<input type="checkbox" ${x.at?'checked':''} data-a="dose" data-k="${esc(x.k)}" aria-label="Taken"></label>`).join('')}</div>`}

function vToday(){const ds=doses(),dn=ds.filter(x=>x.at).length;
 return hello()+(S.set.welcome?welcome():'')+bkNag()+
 (ds.length?`<div class="pcb"><span>Doses taken today</span><b>${dn} of ${ds.length}</b></div>`:`<div class="pcb"><span>Today</span><b>${longDate(tdy())}</b></div>`)+medsCard()+waterCard()}

// Editor for one routine, shown under it in the list
function editor(r,i){const P='routines.'+i;
 return `<div class="edr"><label><span class="mu">Name</span>${I(P+'.n')}</label>
 <div class="two"><label><span class="mu">Kind</span><select data-p="${P}.k" data-t="s">${Object.entries(KIND).map(([k,l])=>`<option value="${k}" ${r.k==k?'selected':''}>${l}</option>`).join('')}</select></label>
 <label><span class="mu">Rounds</span><input type="number" min="1" max="99" step="1" inputmode="numeric" value="${esc(r.rounds)}" data-p="${P}.rounds" data-t="n"></label></div>
 <span class="sec" style="margin-top:4px">Steps <span style="text-transform:none;letter-spacing:0;font-weight:600">(seconds)</span></span>
 ${r.steps.map((x,j)=>`<div class="row ed" data-dl="${P}.steps" data-di="${j}">${DH}${I(P+'.steps.'+j+'.n')}<input type="number" min="1" step="1" inputmode="numeric" value="${esc(x.s)}" data-p="${P}.steps.${j}.s" data-t="n" aria-label="Seconds">${X(P+'.steps',j)}</div>`).join('')||'<p class="mu">No steps yet.</p>'}
 <div class="row" style="margin-top:6px"><button class="g bd" data-a="stepAdd" data-i="${i}">Add a step</button><span style="flex:1"></span><button class="x" data-a="rtDel" data-i="${i}">Delete routine</button></div>
 <button data-a="rtDone" style="width:100%;margin-top:8px">Done</button></div>`}

function vMove(){const recent=S.log.slice(-5).reverse();
 return Object.entries(KIND).map(([k,l])=>{const rs=S.routines.map((r,i)=>[r,i]).filter(([r])=>r.k==k);if(!rs.length)return '';
  return `<div class="card"><h2>${l}</h2>${rs.map(([r,i])=>`<div class="rt"><button class="go" data-a="play" data-i="${i}" aria-label="Start ${esc(r.n)}" ${r.steps.length?'':'disabled'}>${IC(I_PLAY,20)}</button><span class="nm"><b>${esc(r.n)}</b><span class="mu">${r.steps.length} step${r.steps.length==1?'':'s'}${r.rounds>1?' × '+r.rounds:''} · ${mins(rSecs(r))}</span></span><button class="g" data-a="rtEdit" data-i="${i}" aria-label="Edit ${esc(r.n)}">${IC(I_EDIT,19)}</button></div>${EDR==r.id?editor(r,i):''}`).join('')}</div>`}).join('')+
 `<button class="g bd" data-a="rtNew" style="background:var(--card)">New routine</button>`+
 (recent.length?`<div class="card"><h2>Recently</h2>${recent.map(x=>`<div class="ln"><span>${esc(x.n)}</span><b class="mu">${x.d==tdy()?'Today':fd(x.d)} · ${mins(x.sec)}</b></div>`).join('')}</div>`:'')}

function vMeds(){
 return `<div class="card"><h2>Your medications</h2>${S.meds.map((m,i)=>`<div class="med" data-dl="meds" data-di="${i}"><div class="row ed">${DH}${I('meds.'+i+'.n')}${X('meds',i)}</div>
  <div class="row ed"><span class="mu" style="width:16px"></span>${I('meds.'+i+'.dose').replace('<input','<input placeholder="Add a dose"')}</div>
  <div class="times" style="margin-left:24px">${m.times.map((t,j)=>`<span><input type="time" value="${esc(t)}" data-p="meds.${i}.times.${j}" data-t="s" aria-label="Time">${m.times.length>1?`<button class="x" data-a="timeDel" data-i="${i}" data-j="${j}" aria-label="Remove this time">${ICX}</button>`:''}</span>`).join('')}<button class="g" data-a="timeAdd" data-i="${i}">Add a time</button></div></div>`).join('')||'<p class="mu" style="margin:0">Nothing here yet. Add your first one below.</p>'}
 <div class="newmed"><input id="mN" type="text" placeholder="Name, e.g. Vitamin D" enterkeyhint="next"><input id="mD" type="text" placeholder="Dose, e.g. 1 tablet"><input id="mT" type="time" value="08:00" aria-label="Time"></div>
 <button data-a="medAdd" style="width:100%;margin-top:10px">Add medication</button>${flash()}</div>
 <div class="card"><h2>About reminders</h2><p class="mu" style="margin:0">While Big Healthy is open, it tells you when a dose is due. It can’t alert you when the app is closed, so keep your phone’s own alarm for anything you can’t miss.</p></div>`}

function vMore(){
 return `<div class="card"><h2>Settings</h2><div class="sec">Appearance</div><div class="seg qm">${[['system','Auto'],['daynight','Day/Night'],['light','Light'],['dark','Dark']].map(([v,l])=>`<button class="${S.set.theme==v?'on':''}" data-a="theme" data-v="${v}">${l}</button>`).join('')}</div>${window.Feedback?Feedback.view('qm'):''}
 <div class="sec" style="margin-top:12px">Daily water goal</div><div class="row"><input type="number" min="1" max="24" step="1" inputmode="numeric" value="${esc(S.set.water)}" data-a="wGoal"><span class="mu">glasses a day</span></div></div>
 ${window.CloudSync?CloudSync.view():''}
 <div class="card"><h2>Backup & restore</h2><p class="mu">Everything is saved in this browser only. Download a backup now and then to keep it safe, or to move it to another device.</p>
 <p class="mu" style="font-weight:700">${S.set.lastBk?'Last backup: '+longDate(iso(new Date(S.set.lastBk))):'No backup yet.'}</p>
 <div class="row"><button data-a="share">Share backup</button><button data-a="export">Download backup</button></div><div class="row"><button data-a="pickFile">Import backup file</button><input type="file" id="bkf" accept=".json,application/json" style="display:none" data-a="importFile"></div>
 <details style="margin-top:8px" ${O.bk?'open':''} data-o="bk"><summary class="mu">Advanced</summary><div class="row" style="margin-top:8px"><button class="x" data-a="reset">Erase all data</button></div></details></div>`}

// =====================================================================
// 8. ACTIONS (buttons/selects/checkboxes with data-a="name" call ACT.name(dataset, element))
// =====================================================================
function addMed(){const n=document.getElementById('mN').value.trim(),dose=document.getElementById('mD').value.trim(),t=document.getElementById('mT').value||'08:00';
 if(!n){toast('Enter a name first');return}
 S.meds.push({id:uid('m'),n,dose,times:[t]});document.getElementById('mN').value='';document.getElementById('mD').value='';FL='Added “'+n+'”';save();R();FL=''}
// Tick a dose off (or untick it) for today
function takeDose(k,on){const t=tdy(),tk=S.taken[t]=S.taken[t]||{},m=S.meds.find(x=>k.startsWith(x.id+'@'));
 if(on){tk[k]=Date.now();save();R();toast('Logged'+(m?' '+m.n:''))}else{delete tk[k];if(!Object.keys(tk).length)delete S.taken[t];save();R();window.Feedback&&Feedback.hap('tick')}}
// While the app is open: a toast when a dose comes due, and a redraw each minute so "Due" tags and the date stay current
// Doses already due when the app opens don't pop up; the Due tags show them instead.
const NOTED=new Set();let MT0=1;
function medTick(){if(!S)return;doses().forEach(x=>{const k=tdy()+x.k;if(x.due&&!x.at&&!NOTED.has(k)){if(!MT0)toast('Time for '+x.m.n+(x.m.dose?', '+x.m.dose:''));NOTED.add(k)}});
 if(MT0){MT0=0;return}if(!DLG&&!document.hidden&&T=='today'&&!document.activeElement.matches('input'))R()}
setInterval(medTick,30000);
// ---- Routine player: one engine for stretches, intervals and breathing ----
// Each step ends at a fixed clock time, so the countdown stays right even if the phone sleeps for a moment.
let AC=null,WL=null,PLT=0;
function audio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}}
function beep(f=880,n=1,len=.14){if(!AC)return;try{const t=AC.currentTime;for(let k=0;k<n;k++){const o=k*.2,g=AC.createGain(),os=AC.createOscillator();os.type='sine';os.frequency.value=f;g.gain.setValueAtTime(0,t+o);g.gain.linearRampToValueAtTime(.3,t+o+.02);g.gain.linearRampToValueAtTime(0,t+o+len);os.connect(g);g.connect(AC.destination);os.start(t+o);os.stop(t+o+len+.02)}}catch(e){}}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
async function wake(on){try{if(on&&!WL&&'wakeLock' in navigator){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}else if(!on&&WL){const w=WL;WL=null;await w.release()}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&PL&&!PL.fin&&!PL.pz)wake(true)});   // the browser drops the lock when hidden
// Breathing: the circle grows on "Breathe in", stays put on "Hold" and shrinks on "Breathe out"

function morphNode(a,b){
 if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b);return}
 if(a.nodeType!==1){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
 for(const at of [...a.attributes])if(!b.hasAttribute(at.name))a.removeAttribute(at.name);

 if(tag=='TEXTAREA'){if(!act&&a.value!==b.value)a.value=b.value;return}

 if(tag=='INPUT'){if(a.type=='checkbox')a.checked=b.hasAttribute('checked');else if(a.type!='file'&&!act){const v=b.getAttribute('value')??'';if(a.value!==v)a.value=v}}
 else if(tag=='SELECT'){const i=Math.max(0,[...b.options].findIndex(o=>o.hasAttribute('selected')));if(a.selectedIndex!==i)a.selectedIndex=i}
